<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131f24">
<title>Mein Deutsch</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#131f24; --card:#1d2b33; --line:#37464f; --text:#f1f7fb; --muted:#8fa3ad;
  --green:#58cc02; --green-d:#46a302; --red:#ff4b4b; --red-d:#d33131;
  --gold:#ffc800; --gold-d:#e5a400; --blue:#1cb0f6; --blue-d:#1899d6; --orange:#ff9600;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:"Nunito","Segoe UI",Roboto,system-ui,sans-serif;}
button{font-family:inherit;color:inherit}
.hidden{display:none!important}
#app{max-width:560px;margin:0 auto;min-height:100%;position:relative}

/* top bar */
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;justify-content:space-between;
  align-items:center;padding:14px 18px 10px;border-bottom:2px solid var(--line)}
.stat{display:flex;align-items:center;gap:6px;font-weight:800;font-size:18px}
.stat .ic{font-size:22px}
.flag{width:28px;height:20px;border-radius:4px;overflow:hidden;display:inline-flex;flex-direction:column}
.flag i{flex:1}
.streak{color:var(--orange)} .streak.off{color:var(--muted);filter:grayscale(1)}
.xp{color:var(--gold)}
.goalring{width:30px;height:30px}

/* path */
.screen,.screen.pad{padding-bottom:calc(var(--navh,96px) + 28px)}
.unit{margin:18px 16px 8px;scroll-margin-top:72px}
.banner{border-radius:16px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;
  box-shadow:0 4px 0 rgba(0,0,0,.25)}
.banner small{display:block;font-weight:800;opacity:.8;font-size:13px;letter-spacing:.5px;text-transform:uppercase}
.banner b{font-size:21px}
.banner button{background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.35);border-radius:12px;
  padding:8px 10px;font-size:18px;cursor:pointer}
.nodes{display:flex;flex-direction:column;align-items:center;padding:22px 0 8px;gap:18px}
.node{width:76px;height:70px;border-radius:50%;border:none;font-size:30px;cursor:pointer;position:relative;
  box-shadow:0 7px 0 var(--sh);background:var(--bg-n);transition:transform .08s}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--sh)}
.node.locked{--bg-n:#37464f;--sh:#2a363d;color:#52656d}
.node.done{--bg-n:var(--gold);--sh:var(--gold-d)}
.node.current{animation:pulse 1.6s infinite}
.node .start{position:absolute;top:-40px;left:50%;transform:translateX(-50%);background:var(--card);
  border:2px solid var(--line);color:var(--green);font-size:14px;font-weight:900;padding:6px 12px;border-radius:10px;white-space:nowrap}
@keyframes pulse{0%,100%{outline:6px solid rgba(255,255,255,0)}50%{outline:6px solid rgba(255,255,255,.18)}}

/* bottom nav */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--bg);border-top:2px solid var(--line);
  display:flex;justify-content:center;padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
.nav div{display:flex;max-width:560px;width:100%;justify-content:space-around}
.nav button{background:none;border:2px solid transparent;border-radius:14px;padding:6px 10px;font-size:26px;cursor:pointer}
.nav button.on{border-color:var(--blue);background:rgba(28,176,246,.12)}
.nav span{display:block;font-size:11px;font-weight:800;color:var(--muted)}

/* generic */
.pad{padding:18px}
h2{margin:6px 0 14px;font-size:24px}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.btn{display:block;width:100%;border:none;border-radius:16px;padding:15px;font-size:17px;font-weight:900;
  letter-spacing:.6px;text-transform:uppercase;cursor:pointer;background:var(--green);box-shadow:0 5px 0 var(--green-d);color:#fff}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--green-d)}
.btn.blue{background:var(--blue);box-shadow:0 5px 0 var(--blue-d)}
.btn.red{background:var(--red);box-shadow:0 5px 0 var(--red-d)}
.btn.ghost{background:transparent;border:2px solid var(--line);box-shadow:0 4px 0 var(--line);color:var(--muted)}
.btn:disabled{background:#37464f;box-shadow:0 5px 0 #2a363d;color:#6b7f88;cursor:default}
.row{display:flex;gap:10px;align-items:center}
.wordrow{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.wordrow:last-child{border-bottom:none}
.wordrow b{font-size:17px} .wordrow small{display:block;color:var(--muted)}
.spk{background:none;border:none;font-size:22px;cursor:pointer;color:var(--blue);padding:0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--red);margin-left:auto;flex:none}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:60px;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:800;cursor:pointer}
.seg button.on{border-color:var(--blue);color:var(--blue)}
.levelbar{height:14px;background:#37464f;border-radius:8px;overflow:hidden;margin-top:8px}
.levelbar i{display:block;height:100%;background:var(--gold);border-radius:8px}

/* lesson */
#lesson{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.lhead{display:flex;align-items:center;gap:14px;padding:16px 18px}
.lhead button{background:none;border:none;font-size:26px;color:var(--muted);cursor:pointer}
.prog{flex:1;height:16px;background:#37464f;border-radius:10px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--green);border-radius:10px;transition:width .3s}
.lbody{flex:1;overflow-y:auto;padding:6px 18px 18px}
.qtitle{font-size:22px;font-weight:900;margin:8px 0 18px}
.prompt{display:flex;align-items:center;gap:12px;margin-bottom:20px;font-size:20px}
.bubble{border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:19px;line-height:1.35}
.bigspk{width:110px;height:84px;border-radius:18px;border:none;background:var(--blue);box-shadow:0 5px 0 var(--blue-d);font-size:40px;cursor:pointer}
.smallspk{width:60px;height:56px;border-radius:14px;border:none;background:var(--blue);box-shadow:0 4px 0 var(--blue-d);font-size:24px;cursor:pointer}
.choices{display:flex;flex-direction:column;gap:12px}
.choice{text-align:left;border:2px solid var(--line);border-bottom-width:5px;background:transparent;border-radius:14px;
  padding:15px;font-size:18px;cursor:pointer}
.choice.sel{border-color:var(--blue);background:rgba(28,176,246,.12);color:#9fe0ff}
.choice.right{border-color:var(--green);background:rgba(88,204,2,.14);color:#a6ef6b}
.choice.wrong{border-color:var(--red);background:rgba(255,75,75,.14);color:#ff9d9d}
.choice.gone{opacity:.25;pointer-events:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.answerline{min-height:118px;border-top:2px solid var(--line);border-bottom:2px solid var(--line);padding:12px 0;
  display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;margin-bottom:22px;
  background:repeating-linear-gradient(transparent,transparent 52px,var(--line) 52px,var(--line) 54px)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tok{border:2px solid var(--line);border-bottom-width:4px;background:var(--bg);border-radius:12px;padding:9px 13px;font-size:18px;cursor:pointer;height:46px}
.tok.used{background:#37464f;color:transparent;border-color:#37464f;pointer-events:none}
.newcard{text-align:center;padding:20px 0}
.newcard .de{font-size:38px;font-weight:900;margin:18px 0 6px}
.newcard .en{font-size:20px;color:var(--muted)}
.tag{display:inline-block;background:rgba(206,130,255,.18);color:#ce82ff;font-weight:900;font-size:13px;padding:5px 10px;border-radius:8px;letter-spacing:.6px}
.lfoot{padding:16px 18px calc(18px + env(safe-area-inset-bottom));border-top:2px solid var(--line)}
.lfoot.ok{background:#1f3a16;border-color:transparent}
.lfoot.bad{background:#3d1c1c;border-color:transparent}
.fb{margin-bottom:14px;display:none}
.lfoot.ok .fb,.lfoot.bad .fb{display:block}
.fb b{font-size:21px} .lfoot.ok .fb b{color:var(--green)} .lfoot.bad .fb b{color:var(--red)}
.fb div{margin-top:4px;font-size:17px}
.lfoot.ok .btn{background:var(--green)} .lfoot.bad .btn{background:var(--red);box-shadow:0 5px 0 var(--red-d)}

/* end screen */
.endwrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.endwrap h1{color:var(--gold);font-size:32px;margin:10px 0 24px}
.tiles{display:flex;gap:12px;width:100%;justify-content:center}
.tile{flex:1;max-width:150px;border-radius:16px;border:2px solid var(--c);overflow:hidden}
.tile small{display:block;background:var(--c);color:#13202a;font-weight:900;font-size:12px;padding:5px;letter-spacing:.6px}
.tile b{display:block;padding:14px 4px;font-size:24px;color:var(--c)}
.bigemoji{font-size:84px;animation:pop .6s ease}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:85vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px 18px 30px;border-top:2px solid var(--line)}
.sheet p{line-height:1.5;color:#d6e3ea}
.sheet .ex{color:var(--blue);font-weight:800}
.toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);background:var(--card);border:2px solid var(--line);
  padding:12px 18px;border-radius:14px;font-weight:800;z-index:40;max-width:90%;text-align:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none}
.chip{flex:none;border:2px solid var(--line);border-radius:20px;padding:8px 14px;background:var(--card);font-weight:800;font-size:14px;cursor:pointer}
.chip.on{border-color:var(--blue);color:var(--blue);background:rgba(28,176,246,.12)}
.chathead{display:flex;align-items:center;gap:12px;padding:12px 16px 0}
.avatar{width:46px;height:46px;border-radius:50%;background:#ce82ff;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.chatgoal{flex:1}.chatgoal small{color:var(--muted);font-weight:700}
.chat{padding:8px 16px calc(var(--navh,96px) + 100px);display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;padding:11px 14px;border-radius:16px;font-size:17px;line-height:1.4;word-wrap:break-word}
.msg.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--card);border:2px solid var(--line);border-bottom-left-radius:4px}
.msg.ai .en{color:var(--muted);font-size:15px;margin-top:6px;border-top:1px solid var(--line);padding-top:6px}
.msg.ai .acts{display:flex;gap:14px;margin-top:6px}
.msg.ai .acts button{background:none;border:none;color:var(--blue);font-weight:800;font-size:14px;padding:0;cursor:pointer}
.msg.sys{align-self:center;color:var(--muted);font-size:14px;text-align:center}
.fix{align-self:flex-end;max-width:86%;background:rgba(255,200,0,.08);border:2px solid rgba(255,200,0,.45);border-radius:12px;padding:8px 12px;font-size:15px;line-height:1.4}
.fix b{color:var(--gold)}
.typing{align-self:flex-start;color:var(--muted);font-weight:800;padding:6px 4px}
.typing i{display:inline-block;animation:blink 1.2s infinite}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
.chatbar{position:fixed;left:0;right:0;bottom:70px;z-index:6;background:var(--bg);border-top:2px solid var(--line);padding:10px 12px}
.chatbar .in{max-width:536px;margin:0 auto;display:flex;gap:8px}
.chatbar input{flex:1;min-width:0;padding:13px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--text);font-size:16px}
.icbtn{width:52px;flex:none;border-radius:14px;border:none;font-size:22px;background:var(--blue);box-shadow:0 4px 0 var(--blue-d);cursor:pointer}
.icbtn.mic{background:var(--card);border:2px solid var(--line);box-shadow:none}
.icbtn.mic.live{background:var(--red);border-color:var(--red)}
.icbtn:disabled{opacity:.5}
.micbig{width:112px;height:112px;border-radius:50%;border:none;background:var(--blue);box-shadow:0 6px 0 var(--blue-d);font-size:46px;cursor:pointer}
.micbig.live{background:var(--red);box-shadow:0 6px 0 var(--red-d);animation:pulse 1.2s infinite}
.linkbtn{background:none;border:none;color:var(--blue);font-weight:800;font-size:15px;cursor:pointer;padding:8px}
#tgt span.hit{color:var(--green)} #tgt span.miss{color:var(--red);text-decoration:underline}
.section{margin:26px 16px 0;text-align:center}
.section b{display:block;font-size:13px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.section span{font-size:20px;font-weight:900}
.reviewcard{margin:16px 16px 0;border-radius:16px;padding:14px 16px;background:linear-gradient(135deg,#1cb0f6,#2b70c9);display:flex;align-items:center;gap:12px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.reviewcard div{flex:1;font-weight:800}
.reviewcard small{display:block;font-weight:700;opacity:.85}
.reviewcard button{background:#fff;color:#1899d6;border:none;border-radius:12px;padding:10px 14px;font-weight:900;cursor:pointer}
.str{display:inline-flex;gap:2px;margin-left:auto;flex:none}
.str i{width:6px;height:16px;border-radius:2px;background:#37464f}
.str i.on{background:var(--gold)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="stat"><span class="flag"><i style="background:#000"></i><i style="background:#dd0000"></i><i style="background:#ffce00"></i></span><span id="lvl">1</span></div>
    <div class="stat streak" id="streakBox"><span class="ic">🔥</span><span id="streak">0</span></div>
    <div class="stat xp"><span class="ic">⚡</span><span id="xp">0</span></div>
    <div class="stat"><svg class="goalring" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" fill="none" stroke="#37464f" stroke-width="5"/><circle id="goalArc" cx="18" cy="18" r="15" fill="none" stroke="#ffc800" stroke-width="5" stroke-linecap="round" stroke-dasharray="94.2" stroke-dashoffset="94.2" transform="rotate(-90 18 18)"/></svg></div>
  </div>

  <div id="tab-learn" class="screen"></div>
  <div id="tab-practice" class="screen pad hidden"></div>
  <div id="tab-words" class="screen pad hidden"></div>
  <div id="tab-tutor" class="hidden"></div>
  <div id="tab-me" class="screen pad hidden"></div>

  <nav class="nav"><div>
    <button data-tab="learn" class="on">🏠<span>Learn</span></button>
    <button data-tab="practice">🏋️<span>Practice</span></button>
    <button data-tab="tutor">💬<span>Tutor</span></button>
    <button data-tab="words">📖<span>Words</span></button>
    <button data-tab="me">⚙️<span>Me</span></button>
  </div></nav>
</div>

<div id="lesson" class="hidden">
  <div class="lhead"><button id="quitBtn" aria-label="Quit">✕</button><div class="prog"><i id="progBar" style="width:0"></i></div></div>
  <div class="lbody" id="lbody"></div>
  <div class="lfoot" id="lfoot">
    <div class="fb" id="fb"></div>
    <button class="btn" id="checkBtn" disabled>Check</button>
  </div>
</div>

<script>
/* ============ COURSE CONTENT ============
   Each unit: words [German, English], sentences [German, English, {de:[alt German], en:[alt English]}]
   Nouns carry their article (der/die/das) so gender is learned with the word. */
const UNITS = [
 {title:"Greet people", color:"#58cc02",
  tip:"<p><span class='ex'>Hallo</span> works any time. For a polite greeting use the time of day: <span class='ex'>Guten Morgen</span> (morning), <span class='ex'>Guten Tag</span> (daytime), <span class='ex'>Guten Abend</span> (evening).</p><p><span class='ex'>Bitte</span> means please, and it is also how you say you're welcome after <span class='ex'>danke</span>.</p>",
  words:[["Hallo","hello"],["Guten Morgen","good morning"],["Guten Tag","good day, hello"],["Guten Abend","good evening"],["Tschüss","bye"],["danke","thanks, thank you"],["bitte","please"],["ja","yes"],["nein","no"],["Entschuldigung","excuse me, sorry"]],
  sents:[["Guten Morgen!","Good morning!"],["Ja, bitte.","Yes, please."],["Nein, danke.","No, thanks.",{en:["No, thank you."]}],["Danke, tschüss!","Thanks, bye!"],["Hallo, guten Abend!","Hello, good evening!"]]},

 {title:"Introduce yourself", color:"#ce82ff",
  tip:"<p><span class='ex'>sein</span> (to be) changes with the person: <span class='ex'>ich bin</span> (I am), <span class='ex'>du bist</span> (you are).</p><p><span class='ex'>Ich heiße Michael</span> means \"My name is Michael\" (literally \"I am called Michael\").</p><p><span class='ex'>Frau</span> = Ms./Mrs. and <span class='ex'>Herr</span> = Mr. before a last name.</p>",
  words:[["ich","I"],["du","you"],["bin","am"],["bist","are (with du)"],["heiße","am called"],["die Frau","woman, Ms."],["der Herr","Mr., gentleman"],["aus","from"],["und","and"],["wer","who"]],
  sents:[["Ich bin Anna.","I am Anna.",{en:["I'm Anna."]}],["Ich heiße Michael.","My name is Michael.",{en:["I am called Michael."]}],["Wer bist du?","Who are you?"],["Ich bin aus Berlin.","I am from Berlin.",{en:["I'm from Berlin."]}],["Ich bin Frau Schmidt.","I am Ms. Schmidt."],["Bist du Lukas?","Are you Lukas?"]]},

 {title:"Order at a café", color:"#1cb0f6",
  tip:"<p>When ordering you can just name the item and add <span class='ex'>bitte</span>: <span class='ex'>Ein Kaffee, bitte.</span></p><p><span class='ex'>ein</span> goes with der and das words, <span class='ex'>eine</span> with die words: <span class='ex'>ein Tee</span>, <span class='ex'>eine Milch</span>.</p>",
  words:[["der Kaffee","coffee"],["der Tee","tea"],["das Wasser","water"],["die Milch","milk"],["der Saft","juice"],["der Zucker","sugar"],["mit","with"],["oder","or"],["ein","a, an (der/das words)"],["eine","a, an (die words)"]],
  sents:[["Ein Kaffee, bitte.","A coffee, please."],["Tee mit Milch, bitte.","Tea with milk, please."],["Kaffee oder Tee?","Coffee or tea?"],["Kaffee mit Milch und Zucker.","Coffee with milk and sugar."],["Ein Wasser, bitte.","A water, please."]]},

 {title:"Talk about jobs", color:"#ff9600",
  tip:"<p>Many jobs add <span class='ex'>-in</span> for a woman: <span class='ex'>der Lehrer</span> / <span class='ex'>die Lehrerin</span>.</p><p>German leaves out \"a\" with jobs: <span class='ex'>Er ist Lehrer.</span> = He is a teacher.</p>",
  words:[["der Lehrer","teacher (man)"],["die Lehrerin","teacher (woman)"],["der Verkäufer","salesman"],["die Verkäuferin","saleswoman"],["der Bäcker","baker (man)"],["die Bäckerin","baker (woman)"],["der Musiker","musician"],["er","he"],["sie","she"],["ist","is"],["mein","my"],["dein","your"]],
  sents:[["Er ist Lehrer.","He is a teacher."],["Sie ist Bäckerin.","She is a baker."],["Bist du Musiker?","Are you a musician?"],["Ich bin Lehrerin.","I am a teacher.",{en:["I'm a teacher."]}],["Nein, ich bin Verkäufer.","No, I am a salesman.",{en:["No, I'm a salesman."]}]]},

 {title:"Sports and hobbies", color:"#ff4b4b",
  tip:"<p>Verbs change their ending with the person. With <span class='ex'>spielen</span>:</p><p><span class='ex'>ich spiele</span>, <span class='ex'>du spielst</span>, <span class='ex'>er/sie spielt</span>, <span class='ex'>wir spielen</span>.</p><p>Words like <span class='ex'>oft</span> (often) and <span class='ex'>nie</span> (never) usually come right after the verb.</p>",
  words:[["spielen","to play"],["der Fußball","soccer"],["das Tennis","tennis"],["schwimmen","to swim"],["joggen","to jog"],["wandern","to hike"],["machen","to do, to make"],["der Sport","sports"],["das Yoga","yoga"],["oft","often"],["nie","never"],["sportlich","athletic"],["wir","we"]],
  sents:[["Ich spiele oft Tennis.","I often play tennis.",{de:["Oft spiele ich Tennis."],en:["I play tennis often."]}],["Wir spielen Fußball.","We play soccer.",{en:["We are playing soccer."]}],["Du bist sportlich.","You are athletic.",{en:["You're athletic."]}],["Ich schwimme nie.","I never swim."],["Wir machen Yoga.","We do yoga.",{en:["We are doing yoga."]}],["Wir wandern oft.","We often hike.",{en:["We hike often."]}]]},

 {title:"At a party", color:"#2b70c9",
  tip:"<p><span class='ex'>sind</span> is \"are\" for <span class='ex'>wir</span> (we) and <span class='ex'>sie</span> (they): <span class='ex'>Wir sind draußen.</span></p><p><span class='ex'>zu</span> before an adjective means \"too\": <span class='ex'>zu laut</span> = too loud.</p>",
  words:[["die Party","party"],["die Musik","music"],["laut","loud, noisy"],["cool","cool"],["trinken","to drink"],["die Cola","cola"],["durstig","thirsty"],["die Toilette","restroom, toilet"],["draußen","outside"],["sehr","very"],["sind","are (we, they)"],["mehr","more"],["brauchen","to need"],["zu","too"],["wo","where"]],

 {title:"Days of the week", color:"#1cb0f6",

 {title:"Clothes and colors", color:"#ff4b4b",

 {title:"Likes and dislikes", color:"#58cc02",

 {title:"Pay the bill", color:"#ff9600",
  tip:"<p>13 to 19 are number + <span class='ex'>zehn</span>: <span class='ex'>dreizehn</span> (13). Then <span class='ex'>zwanzig</span> (20), <span class='ex'>dreißig</span> (30, spelled with ß), <span class='ex'>hundert</span> (100).</p><p>In restaurants the server often asks <span class='ex'>Zusammen oder getrennt?</span> = Together or separately?</p>",

 {title:"Talk about yesterday", color:"#1cb0f6",
  tip:"<p>Past of <span class='ex'>sein</span>: <span class='ex'>ich war</span>, <span class='ex'>du warst</span>, <span class='ex'>er/sie war</span>, <span class='ex'>wir waren</span>.</p><p>Past of <span class='ex'>haben</span>: <span class='ex'>ich hatte</span>, <span class='ex'>du hattest</span>, <span class='ex'>er/sie hatte</span>, <span class='ex'>wir hatten</span>.</p><p>German says \"I have hunger\": <span class='ex'>Ich habe Hunger.</span> = I'm hungry.</p>",
  words:[["gestern","yesterday"],["war","was (ich, er, sie)"],["warst","were (du)"],["waren","were (wir)"],["hatte","had (ich, er, sie)"],["hattest","had (du)"],["hatten","had (wir)"],["der Hunger","hunger"],["der Durst","thirst"],["krank","sick"],["zu Hause","at home"],["letzte","last"],["keine","no, not any (die words)"],["die Zeit","time"],["in","in"]],

 {title:"What did you do?", color:"#58cc02",
  tip:"<p>To talk about the past, use <span class='ex'>haben</span> + a past participle at the <b>end</b>: <span class='ex'>Ich habe Pizza gegessen.</span></p><p>Most participles are <span class='ex'>ge-</span> + stem + <span class='ex'>-t</span>: machen → <span class='ex'>gemacht</span>, spielen → <span class='ex'>gespielt</span>, kaufen → <span class='ex'>gekauft</span>.</p><p>Some end in <span class='ex'>-en</span>: essen → <span class='ex'>gegessen</span>, trinken → <span class='ex'>getrunken</span>, lesen → <span class='ex'>gelesen</span>, sehen → <span class='ex'>gesehen</span>.</p>",
  words:[["gemacht","done, made"],["gespielt","played"],["gekauft","bought"],["gelernt","learned"],["gekocht","cooked"],["gegessen","eaten, ate"],["getrunken","drunk, drank"],["gelesen","read (past)"],["gesehen","seen, saw"],["kaufen","to buy"],["sehen","to see"],["schon","already"]],
  sents:[["Ich habe Pizza gegessen.","I ate pizza.",{en:["I have eaten pizza.","I've eaten pizza."]}],["Was hast du gemacht?","What did you do?",{en:["What have you done?"]}],["Wir haben Tennis gespielt.","We played tennis.",{en:["We have played tennis."]}],["Sie hat ein Buch gelesen.","She read a book.",{en:["She has read a book."]}],["Hast du den Film gesehen?","Have you seen the movie?",{en:["Did you see the movie?"]}],["Ich habe schon Kaffee getrunken.","I already drank coffee.",{en:["I have already drunk coffee."]}],["Er hat heute gekocht.","He cooked today.",{de:["Heute hat er gekocht."],en:["He has cooked today."]}]]},

 {title:"Where did you go?", color:"#ff9600",
  tip:"<p>Verbs of movement use <span class='ex'>sein</span> instead of haben in the past: <span class='ex'>Ich bin nach Hause gegangen.</span> = I went home.</p><p>gehen → <span class='ex'>gegangen</span>, fahren → <span class='ex'>gefahren</span>, kommen → <span class='ex'>gekommen</span>, fliegen → <span class='ex'>geflogen</span>, laufen → <span class='ex'>gelaufen</span>.</p><p>Use <span class='ex'>nach</span> with cities and countries: <span class='ex'>nach Berlin</span>, <span class='ex'>nach Deutschland</span>.</p>",
  words:[["gegangen","gone, went"],["gefahren","driven, went (by vehicle)"],["gekommen","come, came"],["geflogen","flown, flew"],["gelaufen","run, walked"],["fahren","to drive, to go (by vehicle)"],["fliegen","to fly"],["laufen","to run, to walk"],["der Park","park"],["das Auto","car"],["mit dem Auto","by car"],["nach","to (cities, countries)"],["Deutschland","Germany"]],
  sents:[["Ich bin nach Hause gegangen.","I went home.",{en:["I have gone home."]}],["Wir sind nach Berlin gefahren.","We went to Berlin.",{en:["We drove to Berlin.","We have driven to Berlin."]}],["Bist du mit dem Auto gekommen?","Did you come by car?",{en:["Have you come by car?"]}],["Sie ist nach Deutschland geflogen.","She flew to Germany.",{en:["She has flown to Germany."]}],["Wir sind im Park gelaufen.","We ran in the park.",{en:["We walked in the park."]}],["Gestern bin ich früh gekommen.","Yesterday I came early.",{de:["Ich bin gestern früh gekommen."],en:["I came early yesterday."]}]]},

 {title:"What can you do?", color:"#ce82ff",
  tip:"<p><span class='ex'>kann</span> (can), <span class='ex'>muss</span> (must, have to), <span class='ex'>will</span> (want to), <span class='ex'>möchte</span> (would like).</p><p>The second verb goes to the <b>end</b> in its basic form: <span class='ex'>Ich kann gut schwimmen.</span></p><p>Careful: <span class='ex'>will</span> means want, not \"will\".</p>",

  sents:[["Ich kann gut schwimmen.","I can swim well."],["Kannst du mir helfen?","Can you help me?"],["Ich muss heute arbeiten.","I have to work today.",{de:["Heute muss ich arbeiten."],en:["I must work today."]}],["Wir können Deutsch sprechen.","We can speak German."],["Willst du Gitarre spielen?","Do you want to play guitar?",{en:["Do you want to play the guitar?"]}],["Ich möchte einen Kaffee.","I would like a coffee.",{en:["I'd like a coffee."]}],["Er muss nach Hause gehen.","He has to go home.",{en:["He must go home."]}]]},

const SECTIONS = [{start:0, title:"Beginner basics"}, {start:20, title:"Everyday German"}];
const LESSONS_PER_UNIT = 4; // lesson 4 = unit review
const KNOWN_UNITS = 8;      // matches Duolingo progress: units 1-8 done, start at unit 9

/* ============ STATE ============ */
const KEY = "meinDeutsch.v1";
const ymd = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const addDays = n => { const d=new Date(); d.setDate(d.getDate()+n); return ymd(d); };
const today = () => addDays(0);
const yesterday = () => addDays(-1);
function freshState(){
  const done = {}; for(let u=0;u<KNOWN_UNITS;u++) done[u]=LESSONS_PER_UNIT;
  return {xp:0, streak:0, lastDay:null, dayXp:0, xpDay:null, goal:20, listen:true, rate:0.9, done, mistakes:{}, seen:{}, srs:{}, speak:true, noSpeakUntil:0, lessons:0, askedCarry:false, remind:{on:false, time:"19:00", id:null}};
}
let S;
try { S = Object.assign(freshState(), JSON.parse(localStorage.getItem(KEY)||"null")||{}); } catch(e){ S = freshState(); }
if(!S.srs) S.srs = {};
if(S.speak===undefined) S.speak = true;
if(!S.uid) S.uid = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2);
if(!S.remind || typeof S.remind!=="object") S.remind = {on:false, time:"19:00", id:null};
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ============ AUDIO ============ */
const canSpeak = "speechSynthesis" in window;
let deVoice = null;
function pickVoice(){ if(!canSpeak) return; const v = speechSynthesis.getVoices(); deVoice = v.find(x=>/^de[-_]DE/i.test(x.lang)) || v.find(x=>/^de/i.test(x.lang)) || null; }
if(canSpeak){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text, slow){
  if(!canSpeak) return;
  try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang="de-DE"; if(deVoice) u.voice=deVoice; u.rate = slow?0.55:S.rate; speechSynthesis.speak(u);}catch(e){}
}
let actx=null;
function chime(good){
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const notes = good?[660,880]:[220,180]; notes.forEach((f,i)=>{ const o=actx.createOscillator(), g=actx.createGain();
      o.type=good?"sine":"square"; o.frequency.value=f; g.gain.setValueAtTime(.0001,actx.currentTime+i*.11);
      g.gain.exponentialRampToValueAtTime(good?.25:.08,actx.currentTime+i*.11+.02); g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+i*.11+.18);
      o.connect(g).connect(actx.destination); o.start(actx.currentTime+i*.11); o.stop(actx.currentTime+i*.11+.2); });
  }catch(e){}
}

/* ============ HELPERS ============ */
const $ = s => document.querySelector(s);
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = (a,n) => shuffle(a).slice(0,n);
const norm = s => s.toLowerCase().replace(/[.,!?¿¡"]/g,"").replace(/\s+/g," ").trim();
const tokens = s => s.replace(/[.,!?¿¡"]/g,"").split(/\s+/).filter(Boolean);
const esc = s => s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ART = /^(der|die|das) /;
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
function level(){ return Math.floor(S.xp/100)+1; }
function liveStreak(){ return (S.lastDay===today()||S.lastDay===yesterday()) ? S.streak : 0; }
function dayXp(){ return S.xpDay===today()? S.dayXp : 0; }
function unlockedUnit(u){ return u===0 || (S.done[u-1]||0)>=LESSONS_PER_UNIT || (S.done[u]||0)>0; }
function currentPos(){ for(let u=0;u<UNITS.length;u++){ const d=S.done[u]||0; if(d<LESSONS_PER_UNIT) return {u, l:d}; } return {u:UNITS.length-1, l:LESSONS_PER_UNIT-1, all:true}; }
function wordKey(w){ return w[0]; }

const ICONS = ["⭐","📘","🎧","🏆"];
function renderLearn(){
  const pos = currentPos();
  const offsets = [0,-60,-90,-60,0,60,90,60];
  let html = "";
  const due = dueWords().length;
  if(due) html += `<div class="reviewcard"><div>🔁 ${due} word${due>1?"s":""} ready for review<small>Review now so you don't forget them</small></div><button id="reviewNow">Review</button></div>`;
  UNITS.forEach((un,u)=>{
    const sec = SECTIONS.findIndex(s=>s.start===u);
    if(sec>=0) html += `<div class="section"><b>Section ${sec+1}</b><span>${esc(SECTIONS[sec].title)}</span></div>`;
    html += `<div class="unit" id="unit-${u}"><div class="banner" style="background:${un.color}">
      <div><small>Unit ${u+1}</small><b>${esc(un.title)}</b></div>
      <button data-guide="${u}" aria-label="Guidebook">📒</button></div><div class="nodes">`;
    for(let l=0;l<LESSONS_PER_UNIT;l++){
      const done = (S.done[u]||0) > l;
      const isCur = !pos.all && pos.u===u && pos.l===l;
      const cls = done ? "done" : isCur ? "current" : "locked";
      const style = isCur ? `--bg-n:${un.color};--sh:rgba(0,0,0,.35)` : "";
      const off = offsets[(u*LESSONS_PER_UNIT+l)%offsets.length];
      html += `<button class="node ${cls}" style="margin-left:${off*2}px;${style}" data-u="${u}" data-l="${l}">
        ${cls==="locked"?"🔒":ICONS[l]}${isCur?'<span class="start">START</span>':""}</button>`;
    }
    html += `</div></div>`;
  });
  html += `<div class="pad" style="text-align:center;color:var(--muted)">Section 2 complete when you reach the end. More coming! 💪</div>`;

}

function wireStreakForm(root, after){
  const seg=root.querySelector(".carryDay");

    if(!(n>=0 && n<10000)){ toast("Enter your streak number"); return; }

/* ============ DAILY REMINDERS (push from kingdom-ai) ============ */
const PUSH = "https://push.kingdom-life-ministry.com";
function fmtTime(t){ const [h,m]=t.split(":").map(Number); return ((h%12)||12)+":"+String(m).padStart(2,"0")+(h<12?" AM":" PM"); }
function remindStatus(){
  if(!S.remind.on) return "Get a nudge once a day. It's skipped on days you've already done a lesson.";
  return `On at ${fmtTime(S.remind.time)}. If you still haven't done a lesson by 9:00 PM, you get one more nudge to save your streak.`;
}
async function pushPost(path, body){
  const r = await fetch(PUSH+path, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body), keepalive:true});
  if(!r.ok) throw new Error("Reminder server said "+r.status);
  return r.json().catch(()=>({}));
}
function b64ToU8(s){ s=s.replace(/-/g,"+").replace(/_/g,"/"); s+= "=".repeat((4-s.length%4)%4); const raw=atob(s); return Uint8Array.from(raw,c=>c.charCodeAt(0)); }
function newId(){ return (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2)); }
async function enableReminders(time){
  if(!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window))
    throw new Error("Open the installed app (from GitHub Pages) to turn on reminders");
  const perm = await Notification.requestPermission();
  if(perm!=="granted") throw new Error("Notifications are blocked. Allow them in the app's settings.");
  const reg = await navigator.serviceWorker.ready;
  let key;
  try{ key = (await (await fetch(PUSH+"/vapid")).json()).key; }catch(e){ throw new Error("Can't reach the reminder server right now"); }
  const old = await reg.pushManager.getSubscription(); if(old) await old.unsubscribe();
  const sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64ToU8(key)});
  S.remind.id = S.remind.id || newId();
  await pushPost("/subscribe", {id:S.remind.id, sub:sub.toJSON(), time, tz:Intl.DateTimeFormat().resolvedOptions().timeZone, streak:S.streak, lastDay:S.lastDay});
  S.remind.on = true; S.remind.time = time; save();
}
async function disableReminders(){
  try{ if(S.remind.id) await pushPost("/unsubscribe", {id:S.remind.id}); }catch(e){}
  try{ const reg=await navigator.serviceWorker.ready; const s=await reg.pushManager.getSubscription(); if(s) await s.unsubscribe(); }catch(e){}
  S.remind.on=false; save();
}
function syncStreak(){ if(S.remind.on && S.remind.id) pushPost("/done", {id:S.remind.id, streak:S.streak, lastDay:S.lastDay}).catch(()=>{}); }

/* ============ SPACED REVIEW ============ */
// Each word has a level 0-8. Right answers push the next review further out; misses bring it back today.
const SRS_INT = [0,1,2,4,7,14,30,60,120];
const WORD_BY_KEY = {}; UNITS.forEach((un,u)=>un.words.forEach(w=>WORD_BY_KEY[wordKey(w)]={w,u}));
function srsGrade(w, ok, soft){
  const k=wordKey(w), st=S.srs[k];
  if(soft && st && st.due>today()) return;          // sentence practice only counts for words that are due
  if(ok){ const lvl=Math.min((st?st.lvl:0)+1, SRS_INT.length-1); S.srs[k]={lvl, due:addDays(SRS_INT[lvl])}; }
  else { const lvl=Math.max(1, Math.floor((st?st.lvl:1)/2)); S.srs[k]={lvl, due:today()}; }
}
function seedSrs(){ // words from finished units start mid-strength, spread over the next two weeks
  UNITS.forEach((un,u)=>{ if((S.done[u]||0)>=LESSONS_PER_UNIT) un.words.forEach(w=>{ const k=wordKey(w);
    if(!S.srs[k]){ let h=0; for(const c of k) h=(h*31+c.charCodeAt(0))>>>0; S.srs[k]={lvl:3, due:addDays(h%14)}; } }); });
  save();
}
function dueWords(){
  const t=today();
  return Object.entries(S.srs).filter(([k,st])=>st.due<=t && WORD_BY_KEY[k] && unlockedUnit(WORD_BY_KEY[k].u))
    .sort((a,b)=> a[1].due<b[1].due?-1: a[1].due>b[1].due?1: a[1].lvl-b[1].lvl).map(([k])=>WORD_BY_KEY[k].w);
}
function strengthHtml(w){ const st=S.srs[wordKey(w)]; const n=st?Math.min(4,Math.ceil(st.lvl/2)):0;
  return `<span class="str" title="strength">${[0,1,2,3].map(i=>`<i class="${i<n?"on":""}"></i>`).join("")}</span>`; }
function wordsInSentence(sent, pool){
  const toks=new Set(norm(sent).replace(/'/g,"").split(" "));
  return pool.filter(w=>{ const core=norm(w[0].replace(ART,"")).replace(/'/g,""); return core.split(" ").every(t=>toks.has(t)); });
}
function exWords(e){ if(e.w) return [e.w]; if(e.words) return e.words; if(e.s) return wordsInSentence(e.s[0], L.P.allWords); return []; }

/* ============ SPEAKING ============ */
const SRec = window.SpeechRecognition || window.webkitSpeechRecognition;
function speakOK(){ return !!SRec && S.speak!==false && Date.now() > (S.noSpeakUntil||0); }
const NUMWORDS = {0:"null",1:"ein",2:"zwei",3:"drei",4:"vier",5:"fünf",6:"sechs",7:"sieben",8:"acht",9:"neun",10:"zehn",11:"elf",12:"zwölf",13:"dreizehn",20:"zwanzig",30:"dreißig",100:"hundert"};
function speechNorm(s){ return norm(s).replace(/'/g,"").replace(/\d+/g,d=>NUMWORDS[d]||d).replace(/ß/g,"ss").split(" ").filter(Boolean); }
function lev(a,b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; } return prev[n]; }
const ONE = /^(ein|eine|einen|eins|1)$/;
function wordMatch(x,w){ return x===w || (ONE.test(x)&&ONE.test(w)) || (w.length>=5 && lev(x,w)<=Math.floor(w.length/5)); }
function speechScore(target, heard){
  const t=speechNorm(target), hw=speechNorm(heard), used=new Set();
  const marks=t.map(w=>{ const i=hw.findIndex((x,j)=>!used.has(j)&&wordMatch(x,w)); if(i>=0){ used.add(i); return true; } return false; });
  const ratio = marks.filter(Boolean).length/Math.max(1,t.length);
  const a=t.join(" "), b=hw.join(" "); const charSim = 1 - lev(a,b)/Math.max(1,a.length);
  return {ok: Math.max(ratio,charSim) >= 0.8, marks, score: Math.round(100*Math.max(ratio,charSim))};
}

/* ============ LESSON ENGINE ============ */
let L = null; // current lesson
function poolFor(opts){
  if(opts.mode){
    const units = UNITS.map((un,u)=>u).filter(unlockedUnit);
    let words=[], sents=[];
    units.forEach(u=>{ words=words.concat(UNITS[u].words); sents=sents.concat(UNITS[u].sents); });
    if(opts.mode==="mistakes"){ words = words.filter(w=>S.mistakes[wordKey(w)]>0); }
    if(opts.mode==="review"){ words = dueWords().slice(0,12); }
    return {words, sents, allWords:units.flatMap(u=>UNITS[u].words), allSents:units.flatMap(u=>UNITS[u].sents)};
  }
  const un = UNITS[opts.unit];
  if(opts.lesson===LESSONS_PER_UNIT-1){ // review: this unit plus a bit of earlier units
    let words = un.words.slice(), sents = un.sents.slice();
    for(let u=0;u<opts.unit;u++){ words = words.concat(pick(UNITS[u].words,2)); sents = sents.concat(pick(UNITS[u].sents,1)); }
    return {words, sents, allWords:UNITS.slice(0,opts.unit+1).flatMap(x=>x.words), allSents:UNITS.slice(0,opts.unit+1).flatMap(x=>x.sents)};
  }
  return {words:un.words, sents:un.sents, allWords:UNITS.slice(0,opts.unit+1).flatMap(x=>x.words), allSents:UNITS.slice(0,opts.unit+1).flatMap(x=>x.sents)};
}
function buildExercises(opts){
  const P = poolFor(opts);
  const listenOK = canSpeak && S.listen;
  const ex = [];
  const nouns = P.words.filter(w=>ART.test(w[0]));
  // new-word cards the first time a unit beyond the known ones is opened
  if(!opts.mode && opts.lesson===0){
    P.words.filter(w=>!S.seen[wordKey(w)] && opts.unit>=KNOWN_UNITS).slice(0,5).forEach(w=>ex.push({t:"new", w}));
  }
  let plan;
  const SPK = speakOK();
  if(opts.mode==="review"){
    const cycle=["mc_en","listen","mc_de","speak","article"];
    plan = P.words.map((w,i)=>cycle[i%cycle.length]);
    P.words.forEach((w,i)=>{ let t=plan[i];
      if(t==="article" && !ART.test(w[0])) t="mc_en";
      if(t==="listen" && !listenOK) t="mc_de";
      if(t==="speak" && !SPK) t="mc_en";
      ex.push(t==="listen"? {t, w, s:null} : {t, w});
    });
    if(P.words.length>=4) ex.push({t:"match", words:pick(P.words, Math.min(5,P.words.length))});
    return {ex: shuffle(ex), P};
  }
  if(opts.mode==="speak") plan = ["speak","speak","speak","speak","speak","speak","speak","speak"];
  else if(opts.mode==="listen") plan = ["listen","lbuild","listen","lbuild","mc_de","lbuild","listen","lbuild","listen","lbuild"];
  else if(opts.mode==="mistakes") plan = ["mc_en","mc_de","article","mc_en","match","mc_de","mc_en","article","mc_de","build_de"];
  else if(opts.mode) plan = ["mc_en","build_de","listen","article","match","build_en","mc_de","lbuild","build_de","mc_en"];
  else plan = [
    ["mc_de","mc_en","article","match","listen","mc_en","build_de","speak","article","build_en","lbuild","build_de"],
    ["mc_en","build_de","article","listen","speak","match","mc_de","lbuild","build_de","article","build_en","mc_en"],
    ["build_de","build_en","lbuild","speak","build_de","match","listen","build_en","mc_en","build_de","speak","build_de"],
    ["match","build_de","mc_en","article","lbuild","speak","listen","build_de","mc_de","build_en","article","build_de"]
  ][opts.lesson];
  const wq = shuffle(P.words), sq = shuffle(P.sents);
  let wi=0, si=0;
  const nextW = () => wq.length ? wq[(wi++)%wq.length] : null;
  const nextS = () => sq.length ? sq[(si++)%sq.length] : null;
  plan.forEach(t=>{
    if((t==="listen"||t==="lbuild") && !listenOK) t = t==="listen" ? "mc_de" : "build_de";
    if(t==="speak" && !SPK) t = opts.mode==="speak" ? null : "build_de";
    if(!t) return;
    if(t==="speak"){ const s = P.sents.length ? nextS() : null; if(s) ex.push({t, s}); else { const w=nextW(); if(w) ex.push({t, w}); } return; }
    if(t==="article" && !nouns.length) t="mc_en";
    if((t.startsWith("build")||t==="lbuild") && !P.sents.length) t="mc_en";
    if(t==="match" && P.words.length<4) t="mc_de";
    if(t==="match") ex.push({t, words:pick(P.words,Math.min(5,P.words.length))});
    else if(t==="article") ex.push({t, w:pick(nouns,1)[0]});
    else if(t.startsWith("mc")) { const w=nextW(); if(w) ex.push({t, w}); }
    else if(t==="listen") ex.push({t, s: Math.random()<.5 ? nextS() : null, w: nextW()});
    else { const s=nextS(); if(s) ex.push({t, s}); }
  });
  return {ex, P};
}
function startLesson(opts){
  const {ex,P} = buildExercises(opts);
  if(!ex.length){ toast("Nothing to practice here yet"); return; }
  L = {opts, queue:ex, total:ex.length, doneCount:0, firstTry:0, missed:new Set(), P, cur:null, answered:false};
  $("#lesson").classList.remove("hidden"); document.body.style.overflow="hidden";
  nextExercise();
}
$("#quitBtn").onclick = ()=>{ if(L && L.doneCount>0 && !L.finished){ if(!quitArmed){ quitArmed=true; toast("Tap ✕ again to quit (progress in this lesson is lost)"); setTimeout(()=>quitArmed=false,2500); return; } } quitArmed=false; closeLesson(); };
let quitArmed=false;
function closeLesson(){ if(canSpeak) speechSynthesis.cancel(); $("#lesson").classList.add("hidden"); document.body.style.overflow=""; L=null; refresh(); }

function setFoot(state, html){
  const f=$("#lfoot"); f.className="lfoot"+(state?" "+state:""); $("#fb").innerHTML=html||"";
}
function setCheck(label, enabled, fn){ const b=$("#checkBtn"); b.textContent=label; b.disabled=!enabled; b.onclick=fn; }

function distractWords(correct, field, n){
  const pool = L.P.allWords.filter(w=>w[field]!==correct[field] && norm(w[1])!==norm(correct[1]));
  const seen=new Set([norm(correct[field])]); const out=[];
  for(const w of shuffle(pool)){ const k=norm(w[field]); if(!seen.has(k)){ seen.add(k); out.push(w);} if(out.length>=n) break; }
  return out;
}

function nextExercise(){
  $("#progBar").style.width = (100*L.doneCount/L.total)+"%";
  if(!L.queue.length) return finishLesson();
  const e = L.cur = L.queue.shift(); L.answered=false; L.sel=null;
  setFoot("", "");
  const body = $("#lbody"); body.scrollTop=0;
  ({new:rNew, mc_de:rMC, mc_en:rMC, article:rArticle, match:rMatch, listen:rListen, build_de:rBuild, build_en:rBuild, lbuild:rBuild, speak:rSpeak})[e.t](e, body);
}

function rNew(e, body){
  S.seen[wordKey(e.w)]=1; save();
  body.innerHTML = `<div class="newcard"><span class="tag">NEW WORD</span><div class="de">${esc(e.w[0])}</div><div class="en">${esc(e.w[1])}</div>
    <div style="margin-top:26px"><button class="bigspk" id="say">🔊</button></div></div>`;
  $("#say").onclick=()=>speak(e.w[0]); setTimeout(()=>speak(e.w[0]),250);
  setCheck("Continue", true, ()=>{ L.total--; nextExercise(); });
}

function rMC(e, body){
  const toEn = e.t==="mc_de";
  const opts = shuffle([e.w, ...distractWords(e.w, toEn?1:0, 3)]);
  body.innerHTML = `<div class="qtitle">${toEn?"What does this mean?":"Which one means this?"}</div>
    <div class="prompt">${toEn?`<button class="smallspk" id="say">🔊</button>`:""}<div class="bubble">${esc(toEn?e.w[0]:e.w[1])}</div></div>
    <div class="choices">${opts.map((o,i)=>`<button class="choice" data-i="${i}">${esc(toEn?o[1]:o[0])}</button>`).join("")}</div>`;
  if(toEn){ $("#say").onclick=()=>speak(e.w[0]); setTimeout(()=>speak(e.w[0]),250); }
  wireChoices(opts.map(o=>o===e.w), toEn?e.w[1]:e.w[0], [e.w], ()=>{ if(!toEn) speak(e.w[0]); });
}
function rArticle(e, body){
  const noun = e.w[0].replace(ART,""), art = e.w[0].match(ART)[1];
  const opts = ["der","die","das"];
  body.innerHTML = `<div class="qtitle">Pick the right article</div>
    <div class="prompt"><div class="bubble"><b style="color:var(--blue)">___</b> ${esc(noun)}<div style="color:var(--muted);font-size:15px;margin-top:4px">${esc(e.w[1])}</div></div></div>
    <div class="grid2" style="grid-template-columns:1fr 1fr 1fr">${opts.map((o,i)=>`<button class="choice" style="text-align:center" data-i="${i}">${o}</button>`).join("")}</div>`;
  wireChoices(opts.map(o=>o===art), e.w[0], [e.w], ()=>speak(e.w[0]));
}
function rListen(e, body){
  const isS = !!e.s;
  const target = isS ? e.s[0] : e.w[0];
  let opts;
  if(isS){ opts = shuffle([e.s[0], ...pick(L.P.allSents.filter(s=>s[0]!==e.s[0]).map(s=>s[0]),3)]); }
  else { opts = shuffle([e.w[0], ...distractWords(e.w,0,3).map(w=>w[0])]); }
  body.innerHTML = `<div class="qtitle">What do you hear?</div>
    <div class="row" style="justify-content:center;gap:16px;margin:10px 0 28px"><button class="bigspk" id="say">🔊</button><button class="smallspk" id="slow">🐢</button></div>
    <div class="choices">${opts.map((o,i)=>`<button class="choice" data-i="${i}">${esc(o)}</button>`).join("")}</div>`;
  $("#say").onclick=()=>speak(target); $("#slow").onclick=()=>speak(target,true); setTimeout(()=>speak(target),300);
  wireChoices(opts.map(o=>o===target), target, isS?[]:[e.w]);
}
function wireChoices(correctFlags, answerText, words, onRight){
  const btns = [...document.querySelectorAll("#lbody .choice")];
  btns.forEach(b=>b.onclick=()=>{ if(L.answered) return; btns.forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); L.sel=+b.dataset.i; setCheck("Check", true, check); });
  setCheck("Check", false, null);
  function check(){
    const ok = correctFlags[L.sel];
    btns[L.sel].classList.remove("sel"); btns[L.sel].classList.add(ok?"right":"wrong");
    if(!ok) btns[correctFlags.indexOf(true)].classList.add("right");
    if(ok && onRight) onRight();
    grade(ok, answerText, words);
  }
}

function rMatch(e, body){
  const left = shuffle(e.words), right = shuffle(e.words);
  body.innerHTML = `<div class="qtitle">Tap the matching pairs</div><div class="grid2">
    <div class="choices">${left.map(w=>`<button class="choice" style="text-align:center" data-side="L" data-k="${esc(w[0])}">${esc(w[0])}</button>`).join("")}</div>
    <div class="choices">${right.map(w=>`<button class="choice" style="text-align:center" data-side="R" data-k="${esc(w[0])}">${esc(w[1])}</button>`).join("")}</div></div>`;
  let selL=null, selR=null, matched=0, errors=0; e.bad=new Set();
  setCheck("Check", false, null);
  body.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
    if(b.classList.contains("gone")) return;
    if(b.dataset.side==="L"){ if(selL) selL.classList.remove("sel"); selL=b; speak(b.dataset.k); } else { if(selR) selR.classList.remove("sel"); selR=b; }
    b.classList.add("sel");
    if(selL && selR){
      const a=selL, c=selR; selL=selR=null;
      if(a.dataset.k===c.dataset.k){ [a,c].forEach(x=>{x.classList.remove("sel");x.classList.add("right");}); setTimeout(()=>[a,c].forEach(x=>x.classList.add("gone")),250); matched++;
        if(matched===e.words.length){ chime(true); grade(true, "", [], true, errors>0); } }
      else { errors++; chime(false); [a,c].forEach(x=>{x.classList.remove("sel");x.classList.add("wrong","shake");}); setTimeout(()=>[a,c].forEach(x=>x.classList.remove("wrong","shake")),450);
        const w=e.words.find(w=>w[0]===a.dataset.k); if(w){ S.mistakes[wordKey(w)]=(S.mistakes[wordKey(w)]||0)+1; e.bad.add(w[0]); } }
    }
  });
}

function rBuild(e, body){
  const s = e.s, alt = s[2]||{};
  const toDe = e.t!=="build_en"; // build_de and lbuild produce German
  const answers = toDe ? [s[0], ...(alt.de||[])] : [s[1], ...(alt.en||[])];
  const ansTok = tokens(answers[0]);
  const otherPool = L.P.allSents.filter(x=>x!==s).flatMap(x=>tokens(toDe?x[0]:x[1]));
  const lowAns = new Set(ansTok.map(t=>t.toLowerCase()));
  const extras = []; const seenX=new Set();
  for(const t of shuffle(otherPool)){ const k=t.toLowerCase(); if(!lowAns.has(k)&&!seenX.has(k)){ seenX.add(k); extras.push(t);} if(extras.length>=Math.min(4, Math.max(2, 7-ansTok.length))) break; }
  const bank = shuffle([...ansTok, ...extras]).map((t,i)=>({t,i}));
  let line = [];
  const head = e.t==="lbuild"
    ? `<div class="qtitle">Tap what you hear</div><div class="row" style="justify-content:center;gap:16px;margin-bottom:18px"><button class="bigspk" id="say">🔊</button><button class="smallspk" id="slow">🐢</button></div>`
    : `<div class="qtitle">Write this in ${toDe?"German":"English"}</div><div class="prompt">${toDe?"":`<button class="smallspk" id="say">🔊</button>`}<div class="bubble">${esc(toDe?s[1]:s[0])}</div></div>`;
  body.innerHTML = head + `<div class="answerline" id="aline"></div><div class="bank" id="bank">${bank.map(b=>`<button class="tok" data-i="${b.i}">${esc(b.t)}</button>`).join("")}</div>`;
  const sayBtn=$("#say"); if(sayBtn){ sayBtn.onclick=()=>speak(s[0]); setTimeout(()=>speak(s[0]),300); }
  const slowBtn=$("#slow"); if(slowBtn) slowBtn.onclick=()=>speak(s[0],true);
  const aline=$("#aline");
  function draw(){ aline.innerHTML = line.map(i=>`<button class="tok" data-i="${i}">${esc(bank[i].t)}</button>`).join("");
    document.querySelectorAll("#bank .tok").forEach(b=>b.classList.toggle("used", line.includes(+b.dataset.i)));
    setCheck("Check", line.length>0, check); }
  $("#bank").onclick = ev=>{ const b=ev.target.closest(".tok"); if(!b||L.answered) return; const i=+b.dataset.i; if(line.includes(i)) return; line.push(i); if(toDe) speak(bank[i].t); draw(); };
  aline.onclick = ev=>{ const b=ev.target.closest(".tok"); if(!b||L.answered) return; line=line.filter(x=>x!==+b.dataset.i); draw(); };
  draw(); setCheck("Check", false, null);
  function check(){
    const given = norm(line.map(i=>bank[i].t).join(" "));
    const ok = answers.some(a=>norm(a)===given);
    if(ok && !toDe) speak(s[0]);
    if(ok && toDe && e.t!=="lbuild") speak(s[0]);
    grade(ok, answers[0], ok?[]:wordsInSentence(s[0], L.P.allWords).slice(0,3));
  }
}

function rSpeak(e, body){
  const target = e.s ? e.s[0] : e.w[0];
  const en = e.s ? e.s[1] : e.w[1];
  const toks = tokens(target);
  body.innerHTML = `<div class="qtitle">Speak this ${e.s?"sentence":"word"}</div>
    <div class="prompt"><button class="smallspk" id="say">🔊</button><div class="bubble"><div id="tgt" style="font-size:21px;font-weight:800">${toks.map((t,i)=>`<span data-i="${i}">${esc(t)}</span>`).join(" ")}</div>
      <div style="color:var(--muted);font-size:15px;margin-top:4px">${esc(en)}</div></div></div>
    <div style="text-align:center;margin-top:28px"><button class="micbig" id="mic" aria-label="Tap to speak">🎤</button>
      <div id="heard" style="margin-top:16px;color:var(--muted);min-height:50px;font-size:17px">Tap the mic and read it out loud</div>
      <button class="linkbtn" id="cant">Can't speak now</button></div>`;
  $("#say").onclick=()=>speak(target); setTimeout(()=>speak(target),300);
  let tries=0, rec=null;
  const skip = ()=>{ if(rec) try{rec.abort();}catch(_){}; L.total--; nextExercise(); };
  setCheck("Skip", true, skip);
  $("#cant").onclick=()=>{ S.noSpeakUntil = Date.now()+15*60*1000; save();
    const before=L.queue.length; L.queue = L.queue.filter(x=>x.t!=="speak"); L.total -= (before-L.queue.length);
    toast("Speaking is off for 15 minutes"); skip(); };
  const mic=$("#mic"), heard=$("#heard");
  mic.onclick=()=>{
    if(L.answered) return;
    if(rec){ try{rec.stop();}catch(_){}; return; }
    try{
      rec = new SRec(); rec.lang="de-DE"; rec.interimResults=true; rec.maxAlternatives=3;
      let final=null;
      rec.onresult = ev=>{
        const r = ev.results[ev.results.length-1];
        if(!r.isFinal){ heard.textContent = r[0].transcript; return; }
        let best=null; for(let i=0;i<r.length;i++){ const sc=speechScore(target, r[i].transcript); if(!best||sc.score>best.sc.score) best={sc, text:r[i].transcript}; }
        final=best;
      };
      rec.onerror = ev=>{ heard.textContent = ev.error==="no-speech" ? "I didn't hear anything. Tap the mic and try again."
        : ev.error==="not-allowed" ? "Allow the microphone for this app, or tap Can't speak now."
        : ev.error==="network" ? "Speech check needs internet. Try again or tap Skip." : "Something went wrong. Try again."; };
      rec.onend = ()=>{ rec=null; mic.classList.remove("live");
        if(!final) return;
        const {sc, text} = final; tries++;
        document.querySelectorAll("#tgt span").forEach((sp,i)=>{ sp.classList.toggle("hit", !!sc.marks[i]); sp.classList.toggle("miss", !sc.marks[i]); });
        heard.innerHTML = `I heard: <b style="color:var(--text)">${esc(text)}</b>`;
        if(sc.ok){ grade(true, target); }
        else if(tries<2){ chime(false); heard.innerHTML += `<div style="color:var(--orange);margin-top:6px">Almost! Listen 🔊 and try once more.</div>`; }
        else { grade(false, target); }
      };
      mic.classList.add("live"); heard.textContent="Listening..."; rec.start();
    }catch(err){ rec=null; mic.classList.remove("live"); heard.textContent="Voice input isn't available here. Tap Skip."; }
  };
}

function grade(ok, answerText, words, isMatch, hadErr){
  L.answered = true;
  if(!isMatch) chime(ok);
  const e = L.cur;
  // spaced review bookkeeping (first try only)
  if(!L.missed.has(e)){
    if(e.t==="match") e.words.forEach(w=>srsGrade(w, !(e.bad && e.bad.has(w[0]))));
    else if(e.w) srsGrade(e.w, ok);
    else if(e.s && ok) wordsInSentence(e.s[0], L.P.allWords).forEach(w=>srsGrade(w, true, true));
  }
  if(hadErr) L.missed.add(e);
  if(ok){
    if(!L.missed.has(e)) L.firstTry++;
    L.doneCount++;
    (words||[]).forEach(w=>{ if(S.mistakes[wordKey(w)]) S.mistakes[wordKey(w)]--; });
    if(e.w && S.mistakes[wordKey(e.w)]) S.mistakes[wordKey(e.w)]--;
    const praise = ["Nice!","Richtig!","Great job!","Sehr gut!","Super!","You got it!"];
    setFoot("ok", `<b>✓ ${praise[Math.floor(Math.random()*praise.length)]}</b>${answerText&&!isMatch?`<div>${esc(answerText)}</div>`:""}`);
  } else {
    L.missed.add(e);
    L.queue.push(e); // comes back at the end, like Duolingo
    (words||[]).forEach(w=>S.mistakes[wordKey(w)]=(S.mistakes[wordKey(w)]||0)+1);
    if(e.w) S.mistakes[wordKey(e.w)]=(S.mistakes[wordKey(e.w)]||0)+1;
    setFoot("bad", `<b>✗ Correct answer:</b><div>${esc(answerText)}</div>`);
    const lb=$("#lbody"); lb.classList.add("shake"); setTimeout(()=>lb.classList.remove("shake"),400);
  }
  save();
  setCheck("Continue", true, nextExercise);
}

function creditPractice(gain){
  const goalBefore = dayXp() >= S.goal;
  const t=today(); let streakUp=false;
  if(S.lastDay!==t){ S.streak = (S.lastDay===yesterday()) ? S.streak+1 : 1; S.lastDay=t; streakUp=true; }
  if(S.xpDay!==t){ S.xpDay=t; S.dayXp=0; }
  S.xp += gain; S.dayXp += gain; S.lessons++;
  save(); syncStreak();
  return {streakUp, goalHit: !goalBefore && dayXp()>=S.goal};
}
function finishLesson(){
  L.finished = true;
  const counted = L.total || 1;
  const acc = Math.round(100*L.firstTry/counted);
  const perfect = L.missed.size===0;
  const gain = 10 + (perfect?5:0);
  const o=L.opts;
  if(!o.mode && (S.done[o.unit]||0)===o.lesson) S.done[o.unit]=o.lesson+1;
  const {streakUp, goalHit} = creditPractice(gain);
  if(!o.mode && o.lesson===LESSONS_PER_UNIT-1) seedSrs();
  const unitDone = !o.mode && o.lesson===LESSONS_PER_UNIT-1;
  $("#progBar").style.width="100%";
  $("#lbody").innerHTML = `<div class="endwrap">
    <div class="bigemoji">${unitDone?"🏆":perfect?"🌟":"🎉"}</div>
    <h1>${unitDone?"Unit complete!":perfect?"Perfect lesson!":"Lesson complete!"}</h1>
    <div class="tiles">
      <div class="tile" style="--c:var(--gold)"><small>TOTAL XP</small><b>⚡ ${gain}</b></div>
      <div class="tile" style="--c:var(--green)"><small>ACCURACY</small><b>🎯 ${acc}%</b></div>
      <div class="tile" style="--c:var(--orange)"><small>STREAK</small><b>🔥 ${S.streak}</b></div>
    </div>
    ${streakUp?`<p style="margin-top:22px;font-weight:800;color:var(--orange)">${S.streak===1?"Streak started! Come back tomorrow.":"Streak extended to "+S.streak+" days!"}</p>`:""}
    ${goalHit?`<p style="font-weight:800;color:var(--gold)">Daily goal reached! 🎯</p>`:""}
  </div>`;
  setFoot("", "");
  chime(true); setTimeout(()=>chime(true),220);
  setCheck("Continue", true, closeLesson);
}

/* ============ AI TUTOR (Ollama on kingdom-ai) ============ */
const SCENES = [["free","💬 Free chat"],["cafe","☕ Café"],["imbiss","🥨 Snack bar"],["meet","👋 Meet someone"],["hobbies","⚽ Hobbies"],["family","👨‍👩‍👧 Family"],["weather","🌦️ Weather"],["directions","🗺️ Directions"]];
const CHAT_KEY = "meinDeutsch.chat";
const CHAT_GOAL = 5;
let T; try{ T = JSON.parse(localStorage.getItem(CHAT_KEY)||"null"); }catch(e){}
if(!T || !Array.isArray(T.msgs)) T = {scene:"free", msgs:[], count:0, credited:false};
let tutorBusy=false, recog=null;
function saveChat(){ try{ T.msgs=T.msgs.slice(-60); localStorage.setItem(CHAT_KEY, JSON.stringify(T)); }catch(e){} }
function knownWords(){ return unlockedWords().map(x=>x.w[0]); }
function openTutor(){
  renderTutor();
  if(!T.msgs.length && !tutorBusy) tutorSend("");
}
function renderTutor(){
  const el=$("#tab-tutor");
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const left = Math.max(0, CHAT_GOAL - T.count);
  el.innerHTML = `<div class="chathead"><div class="avatar">👩‍🏫</div><div class="chatgoal"><b>Lena</b> <small>· your German tutor</small><br>
      <small>${T.credited?"✅ Chat lesson done. Keep talking or start a new chat!":`${left} more message${left===1?"":"s"} to finish a chat lesson (+10 XP)`}</small></div>
      <button class="chip" id="newChat">New chat</button></div>
    <div class="chips">${SCENES.map(([k,n])=>`<button class="chip ${T.scene===k?"on":""}" data-scene="${k}">${n}</button>`).join("")}</div>
    <div class="chat" id="chat">${T.msgs.map(msgHtml).join("")}${tutorBusy?'<div class="typing">Lena is typing <i>●</i><i>●</i><i>●</i></div>':""}</div>
    <div class="chatbar"><div class="in">
      ${SR?'<button class="icbtn mic" id="micBtn" aria-label="Speak German">🎤</button>':""}
      <input id="chatIn" placeholder="Schreib auf Deutsch..." autocomplete="off" enterkeyhint="send">
      <button class="icbtn" id="sendBtn" aria-label="Send" ${tutorBusy?"disabled":""}>➤</button></div></div>`;
  const nav=document.querySelector(".nav"); el.querySelector(".chatbar").style.bottom = nav.offsetHeight+"px";
  el.querySelectorAll("[data-scene]").forEach(b=>b.onclick=()=>{ if(tutorBusy) return; T={scene:b.dataset.scene,msgs:[],count:0,credited:false}; saveChat(); openTutor(); });
  $("#newChat").onclick=()=>{ if(tutorBusy) return; T={scene:T.scene,msgs:[],count:0,credited:false}; saveChat(); openTutor(); };
  const inp=$("#chatIn");
  const send=()=>{ const v=inp.value.trim(); if(!v||tutorBusy) return; inp.value=""; tutorSend(v); };
  $("#sendBtn").onclick=send; inp.onkeydown=e=>{ if(e.key==="Enter") send(); };
  const mic=$("#micBtn");
  if(mic) mic.onclick=()=>{
    if(recog){ recog.stop(); return; }
    try{ recog=new SR(); recog.lang="de-DE"; recog.interimResults=false; recog.maxAlternatives=1;
      recog.onresult=e=>{ inp.value=e.results[0][0].transcript; inp.focus(); };
      recog.onerror=e=>{ if(e.error==="not-allowed") toast("Allow the microphone to speak to Lena"); };
      recog.onend=()=>{ recog=null; mic.classList.remove("live"); };
      mic.classList.add("live"); recog.start(); toast("Sprich jetzt... (speak now)");
    }catch(err){ recog=null; toast("Voice input isn't available here"); }
  };
  el.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>speak(b.dataset.say));
  el.querySelectorAll("[data-en]").forEach(b=>b.onclick=()=>{ const en=b.closest(".msg").querySelector(".en"); en.classList.toggle("hidden"); b.textContent=en.classList.contains("hidden")?"Show English":"Hide English"; });
  el.querySelectorAll("[data-retry]").forEach(b=>b.onclick=()=>{ const last=T.msgs.pop(); saveChat(); const u=[...T.msgs].reverse().find(m=>m.role==="user"); if(u && T.msgs[T.msgs.length-1]===u){ T.msgs.pop(); T.count=Math.max(0,T.count-1); tutorSend(u.text); } else tutorSend(""); });
  window.scrollTo(0, document.body.scrollHeight);
}
function msgHtml(m){
  if(m.role==="user") return `<div class="msg me">${esc(m.text)}</div>${m.fix?`<div class="fix"><b>✏️ Better:</b> ${esc(m.fix)}${m.tip?`<br><span style="color:var(--muted)">${esc(m.tip)}</span>`:""}</div>`:""}`;
  if(m.role==="sys") return `<div class="msg sys">${esc(m.text)} <button class="chip" data-retry style="margin-left:6px">Try again</button></div>`;
  return `<div class="msg ai">${esc(m.de)}<div class="en hidden">${esc(m.en||"")}</div>
    <div class="acts">${canSpeak?`<button data-say="${esc(m.de)}">🔊 Listen</button>`:""}${m.en?`<button data-en>Show English</button>`:""}</div></div>`;
}
async function tutorSend(text){
  if(tutorBusy) return;
  let userMsg=null;
  if(text){ userMsg={role:"user", text}; T.msgs.push(userMsg); }
  tutorBusy=true; saveChat(); renderTutor();
  const history = T.msgs.filter(m=>m!==userMsg && m.role!=="sys").slice(-12).map(m=> m.role==="user" ? {role:"user",content:m.text} : {role:"assistant",content:m.de});
  try{
    const r = await fetch(PUSH+"/tutor", {method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({id:S.uid, scene:T.scene, scenario:T.scene, known:knownWords(), history, message:text})});
    const d = await r.json().catch(()=>({}));
    if(!r.ok || !d.german) throw new Error(d.error || "Lena couldn't answer");
    if(userMsg && d.correction && norm(d.correction)!==norm(text)){ userMsg.fix=d.correction; userMsg.tip=d.tip||""; }
    T.msgs.push({role:"ai", de:d.german, en:d.english||""});
    if(S.listen) speak(d.german);
    if(userMsg){ T.count++;
      if(!T.credited && T.count>=CHAT_GOAL){ T.credited=true; const {streakUp}=creditPractice(10); chime(true);
        toast(streakUp ? `Chat lesson done! +10 XP · 🔥 ${S.streak} day streak` : "Chat lesson done! +10 XP"); renderHeader(); } }
  }catch(err){
    T.msgs.push({role:"sys", text: (err && err.message && !/fetch/i.test(err.message)) ? err.message : "Can't reach Lena right now. Is kingdom-ai on?"});
  }
  tutorBusy=false; saveChat();
  if(!$("#tab-tutor").classList.contains("hidden")) renderTutor();
}
